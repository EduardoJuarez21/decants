<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="|Catalogo Aura Decants ${mesActual} ${anioActual}|">Catalogo Aura Decants</title>
    <style>
        @page {
            size: letter;
            margin: 0.55in;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #201d19;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            line-height: 1.35;
            background: #fbfaf7;
        }

        .cover {
            height: 9.9in;
            padding: 1.05in 0.65in;
            color: #fff;
            background: #171411;
            text-align: center;
            page-break-after: always;
        }

        .logo {
            width: 142px;
            height: auto;
            margin-bottom: 32px;
        }

        .gold-line {
            width: 86px;
            height: 2px;
            margin: 0 auto 28px;
            background: #c5a46b;
        }

        .cover-kicker {
            display: inline-block;
            margin: 0 0 22px;
            padding: 7px 16px;
            border: 1px solid rgba(197, 164, 107, 0.45);
            color: #c5a46b;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .cover-month {
            margin: 0 0 18px;
            color: #c5a46b;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 48px;
            font-weight: 700;
            line-height: 1.05;
        }

        .tagline {
            width: 430px;
            margin: 24px auto 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .cover-promo {
            display: inline-block;
            margin-top: 34px;
            padding: 11px 24px;
            border-radius: 999px;
            color: #fff;
            background: #b83a2f;
            font-size: 12px;
            font-weight: 700;
        }

        .cover-footer {
            margin-top: 90px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 10px;
            letter-spacing: 1px;
        }

        .section {
            margin-bottom: 22px;
        }

        .section.break {
            page-break-before: always;
        }

        .section-head {
            margin-bottom: 14px;
            padding: 16px 18px;
            color: #fff;
            background: #201d19;
            border-left: 5px solid #c5a46b;
        }

        h2 {
            margin: 0;
            color: #fff;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 24px;
            line-height: 1.1;
        }

        .section-subtitle {
            margin: 5px 0 0;
            color: rgba(255, 255, 255, 0.68);
            font-size: 10px;
        }

        h3 {
            margin: 20px 0 10px;
            padding: 8px 10px;
            color: #2a2723;
            background: #eee4d3;
            border-left: 4px solid #c5a46b;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 14px;
        }

        .promo-note {
            margin: 0 0 12px;
            padding: 10px 14px;
            color: #fff;
            background: #b83a2f;
            border-radius: 4px;
            font-weight: 700;
        }

        .grid {
            width: 100%;
        }

        .grid-clear {
            clear: both;
        }

        .product {
            float: left;
            width: 48.7%;
            margin: 0 0 10px;
            page-break-inside: avoid;
        }

        .product:nth-child(odd) {
            margin-right: 2.6%;
        }

        .card {
            padding: 0;
            border: 1px solid #dccfbb;
            border-radius: 8px;
            background: #fff;
            overflow: hidden;
        }

        .card-body {
            padding: 10px 12px 12px;
        }

        .product-image {
            width: 100%;
            height: 132px;
            margin: 0;
            border-bottom: 1px solid #eadfce;
            border-radius: 0;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .product-image.placeholder {
            padding-top: 34px;
            color: #a37e3e;
            background: #f1eadf;
            border: 0;
            border-bottom: 1px solid #eadfce;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
            text-transform: uppercase;
        }

        .badge {
            display: inline-block;
            margin: 0 4px 5px 0;
            padding: 3px 7px;
            border-radius: 4px;
            color: #fff;
            background: #c5a46b;
            font-size: 7.5px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .badge.out {
            background: #b83a2f;
        }

        .brand {
            display: block;
            color: #857b6e;
            font-size: 8.5px;
            font-weight: 700;
            letter-spacing: 0.7px;
            text-transform: uppercase;
        }

        .name {
            display: block;
            margin-top: 3px;
            color: #1f1d1a;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.15;
        }

        .family {
            display: block;
            margin-top: 4px;
            color: #766d63;
            font-size: 9px;
            font-style: italic;
        }

        .inspiration {
            margin: 5px 0 0;
            color: #766d63;
            font-size: 8px;
            font-style: italic;
        }

        .tags {
            margin-top: 7px;
            color: #a37e3e;
            font-size: 8px;
            font-weight: 700;
        }

        .prices {
            margin-top: 10px;
            padding-top: 9px;
            border-top: 1px solid #eee5d7;
            color: #1f1d1a;
            font-size: 9px;
            font-weight: 700;
        }

        .price {
            display: inline-block;
            margin: 0 5px 4px 0;
            padding: 3px 6px;
            border-radius: 4px;
            background: #f1eadf;
        }

        .old {
            color: #90877c;
            text-decoration: line-through;
        }

        .promo-price {
            color: #b83a2f;
        }

        .footer {
            margin-top: 24px;
            padding: 10px 12px;
            color: #fff;
            background: #201d19;
            font-size: 9px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="cover">
    <img class="logo" th:src="${logoSrc}" alt="Aura Decants MX" />
    <div class="gold-line"></div>
    <p class="cover-kicker">Aura Decants MX</p>
    <p class="cover-month" th:text="|${mesActual} ${anioActual}|">Julio 2026</p>
    <h1>Catalogo de Fragancias</h1>
    <p class="tagline">Decants de perfumes originales. Alta Perfumeria y Perfumeria Arabe.</p>
    <p class="cover-promo" th:if="${promoTexto != null and !promoTexto.isBlank()}" th:text="${promoTexto}"></p>
    <p class="cover-footer">auradecantsmx.com</p>
</div>

<div class="section" th:if="${!productosPromo.isEmpty()}">
    <div class="section-head">
        <h2 th:text="|Promociones de ${mesActual}|">Promociones del mes</h2>
        <p class="section-subtitle">Fragancias con descuento activo en este catalogo.</p>
    </div>
    <p class="promo-note" th:if="${promoTexto != null and !promoTexto.isBlank()}" th:text="${promoTexto}"></p>
    <div class="grid">
        <div class="product" th:each="p : ${productosPromo}">
            <div th:replace="~{catalogo-pdf-fragments :: productCard(${p})}"></div>
        </div>
        <div class="grid-clear"></div>
    </div>
</div>

<div class="section" th:classappend="${!productosPromo.isEmpty()} ? 'break'">
    <div class="section-head">
        <h2>Catalogo Completo</h2>
        <p class="section-subtitle" th:text="|Actualizado en ${mesActual} ${anioActual}|">Actualizado este mes</p>
    </div>

    <div th:replace="~{catalogo-pdf-fragments :: productSection('Alta Perfumeria - Para El', ${productos.?[categoria == 'alta-perfumeria' and genero == 'hombre']})}"></div>
    <div th:replace="~{catalogo-pdf-fragments :: productSection('Alta Perfumeria - Para Ella', ${productos.?[categoria == 'alta-perfumeria' and genero == 'mujer']})}"></div>
    <div th:replace="~{catalogo-pdf-fragments :: productSection('Alta Perfumeria - Unisex', ${productos.?[categoria == 'alta-perfumeria' and genero != 'hombre' and genero != 'mujer']})}"></div>
    <div th:replace="~{catalogo-pdf-fragments :: productSection('Perfumeria Arabe - Para El', ${productos.?[categoria == 'nicho-arabe' and genero == 'hombre']})}"></div>
    <div th:replace="~{catalogo-pdf-fragments :: productSection('Perfumeria Arabe - Para Ella', ${productos.?[categoria == 'nicho-arabe' and genero == 'mujer']})}"></div>
    <div th:replace="~{catalogo-pdf-fragments :: productSection('Perfumeria Arabe - Unisex', ${productos.?[categoria == 'nicho-arabe' and genero != 'hombre' and genero != 'mujer']})}"></div>
</div>

<div class="footer">
    Pedidos por WhatsApp: <span th:text="${waNumero}"></span> | auradecantsmx.com
</div>

</body>
</html>
